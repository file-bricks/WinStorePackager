name: Source-Platform-Smoke

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: pytest installieren
        run: pip install pytest

      - name: Unix-Preflight- und Profilformat-Tests ausführen
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/test_unix_preflight.py tests/test_project_profile.py -v
